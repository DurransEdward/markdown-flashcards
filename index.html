<!DOCTYPE html>
<html>

<head>
    <title>Q&A App</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.css" crossorigin="anonymous">

    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div id="card-container">
        <div id="cards-remaining" hidden></div>
        <div id="card">
            <div id="badges">
                <div id="important-badge" hidden>⚠️IMPORTANT⚠️</div>
                <div id="level-badge" hidden></div>
            </div>
            <div id="text">
                <h1 id="header" class="card-heading">↓↓ Load a deck at the bottom of the page ↓↓</h1>
                <div id="question-text"></div>
                <div id="answer-section" hidden>
                    <h1 class="card-heading">Answer</h1>
                    <div id="answer-text"></div>
                </div>
            </div>
            <textarea id="answer-input" placeholder="Write your answer here..."></textarea>
        </div>
    </div>

    <div id="buttons">
        <button id="reveal-button" hidden>Reveal Answer</button>
        <button id="skip-button" hidden>Skip Card</button>
        <button id="correct-button" hidden>Correct</button>
        <button id="almost-correct-button" hidden>Almost Correct</button>
        <button id="incorrect-button" hidden>Incorrect</button>
        <button id="restart-button" hidden>Restart Quiz</button>
    </div>

    <div id="file-input-container">
        <input type="text" id="file-input" placeholder="Deck file name">
        <button id="load-deck-button">Load Deck</button>
    </div>
    
    <script type="module" src="app.js"></script>
</body>

</html>
